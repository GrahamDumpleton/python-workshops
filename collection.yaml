# What the collection indexes cannot be built from the manifests: the
# analytics block, carried by `just index` into every collection.json.
# Progress events are sent only with the learner's opt-in from the trust
# dialog, or where a deployment's settings turn reporting on.
#
# The token is a placeholder until the analytics service issues one for
# these workshops. Issuing needs the service's signing key, so it is the
# owner's step, not an agent's. Until then the sink refuses the events,
# and nothing is recorded. Replace the token here, then run `just index`
# to carry it into every collection index.
analytics:
  sink: https://workshop-analytics.grumpys.work/events
  token: PLACEHOLDER-ISSUE-AN-INGEST-TOKEN-FOR-PYTHON-WORKSHOPS
