# This repository is a collection of workshops, not a Python package: uv
# manages the environment the workshops are written, checked and run in.
# The runtime dependencies are what a learner needs, JupyterLab and the
# extension; the dev group adds the MCP server, the self-test and the
# JupyterLite site builder used while writing. jupyterlab-workshop is
# pinned once, here, and the dev group's extras resolve to the same
# release.
#
# Nothing the workshops teach is installed here, with one exception.
# Collections I to V use the standard library alone, and the packages
# of collection VI are installed by the learner, in a virtual
# environment they make inside the workshop's workspace, since
# installing them is the lesson. The exception is uv itself, the tool
# that workshop `the-same-with-uv` teaches: it is a runtime dependency
# so that Binder, a codespace and the self-test all have the same uv
# on the PATH of the learner's terminal.
[project]
name = "python-workshops"
version = "0.1.0"
description = "Guided JupyterLab workshops teaching Python to people new to programming"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyterlab>=4.6,<5",
    "jupyterlab-workshop==0.22.1",
    "uv>=0.12",
]

[dependency-groups]
dev = [
    "jupyterlab-workshop[mcp,test,lite]",
]

[tool.uv]
package = false

# A learner who runs `uv init` in a workshop's workspace is inside this
# checkout on Binder and in a codespace. Without this, uv would make
# the learner's project a member of this one, edit this file, and
# install into the environment that runs JupyterLab. Excluded, the
# learner's project stands alone.
[tool.uv.workspace]
members = []
exclude = ["workshops/*/work", "workshops/*/work/**"]
