  - pages/04-your-own-default-value.md
  - pages/05-naming-an-argument.md
  - pages/06-choosing-an-option.md
  - pages/07-describing-a-function.md
  - pages/08-a-function-that-calls-a-function.md
  - pages/09-your-own-functions.md
  - pages/10-finish.md
