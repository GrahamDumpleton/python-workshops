apiVersion: jupyterlab-workshop/v1alpha1
name: counting-words
title: Counting words
version: 0.1.0
description: Build a complete program in six parts, with hints but without the code. From the text of five of Aesop's fables, your program finds which words are most common, which fable is the longest, and which words are in every fable. It uses functions, dictionaries, sets and loops together.
authors: [Graham Dumpleton]
homepage: https://github.com/GrahamDumpleton/python-workshops/tree/main/workshops/counting-words
issues: https://github.com/GrahamDumpleton/python-workshops/issues
tags: [python, beginners, project]
duration: 25m
platforms: [linux, macos, windows]
frontends: [jupyterlab, jupyterlite]
capabilities:
  - write-files
  - kernel-exec
layout: notebook
layouts:
  notebook:
    main:
      areas:
        - { name: notebook, tabs: [] }
instructions: { side: right, width: 0.35 }
gating: soft
finish: |
  You have built a complete program from a goal, without being told
  each step. You can now write a function that returns a value, count
  things with a dictionary, find the values that several sets share,
  and build a larger program from small functions that you test one at
  a time.

  The set **Python functions and data** is now complete. The next set
  of workshops is **Working with real data in Python**. It begins with
  the workshop **Reading and writing files**, which shows how a program
  reads its data from a file and saves its results in a file.

  The Python tutorial covers dictionaries and sets in
  [Data Structures](https://docs.python.org/3/tutorial/datastructures.html#sets).
  It is written for people who already program, so do not worry if
  some of it is difficult to read now.
variables:
  - name: notebook
    type: path
    default: counting-words.ipynb
    description: The notebook the exercises are done in
pages:
  - pages/01-welcome.md
  - pages/02-the-fables.md
  - pages/03-a-list-of-clean-words.md
  - pages/04-count-the-words.md
  - pages/05-all-the-fables-together.md
  - pages/06-the-most-common-words.md
  - pages/07-the-longest-fable.md
  - pages/08-the-words-in-every-fable.md
  - pages/09-finish.md
