name: where-imports-come-from
title: Where imports come from
version: 0.1.0
description: Learn how Python finds the file for an import. You look at the list of directories that Python searches, see where the standard library and installed code are kept, find the file that a module came from, and find and repair the bug of a file of your own that hides a module of Python.
