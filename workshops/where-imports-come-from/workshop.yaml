finish: |
  You now know how Python finds the file for an import. You know that
  `sys.path` is a list of directories, and that Python searches them
  in order and uses the first file that has the right name. You know
  that the first directory is the directory of your script, that the
  standard library has a directory of its own, and that installed
  code is kept in the directory `site-packages`. You can find the
  file that a module came from with `__file__`, and you can find and
  repair the bug of a file of your own that hides a module of Python.

  The next workshop is **Making a package**. The spending tracker is
  four modules in one directory. In the next workshop you put them
  into a directory of their own, which can be imported with one
  name.

  The Python tutorial covers this subject in
  [The Module Search Path](https://docs.python.org/3/tutorial/modules.html#the-module-search-path).
  It is written for people who already program, so do not worry if
  some of it is difficult to read now.
