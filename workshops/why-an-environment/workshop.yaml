apiVersion: jupyterlab-workshop/v1alpha1
name: why-an-environment
title: Why an environment
version: 0.1.0
description: See the problem that appears when every project on a computer shares one Python. You install a package for one small project, install a newer version of the same package for a second project, and watch the first project stop working, although you did not change it. You end with the idea that solves the problem, which is a place for installed packages that belongs to one project.
