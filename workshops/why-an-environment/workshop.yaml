instructions: { side: right, width: 0.35 }
gating: soft
finish: |
  You have seen the problem that a virtual environment solves. You know
  that a Python keeps installed packages in its directory
  `site-packages`, and that this directory holds one version of each
  package. You installed a package for one project, and then a newer
  version of it for a second project, and the first project stopped
  working, although you did not change it. You know why no version was
  right for both projects, and you know what each project needs: a
  `site-packages` of its own.

  The next workshop is **An environment of your own**. In it you make a
  virtual environment for a project yourself, you look at what is
  inside it, and you learn what it means to activate it.

  The Python tutorial covers this subject in
  [Virtual Environments and Packages](https://docs.python.org/3/tutorial/venv.html#introduction).
  It is written for people who already program, so do not worry if
  some of it is difficult to read now.
