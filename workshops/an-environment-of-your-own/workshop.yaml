finish: |
  You can now give a project a Python environment of its own. You
  know that a virtual environment is a directory, which holds its own
  `python` and its own `site-packages`. You can make one with
  `python -m venv .venv`. You know that activating an environment
  puts its directory `bin` first on `PATH`, so that the word `python`
  means the Python of the environment, and that `deactivate` puts
  `PATH` back. You can run the Python of an environment by its path,
  with no activation. You know that an environment holds nothing that
  you wrote, so you can delete it and make it again.

  The next workshop is **Installing packages**. In this workshop you
  installed one package with one command. The next workshop explains
  that command, shows where packages come from, and shows how a
  project keeps a list of the packages that it needs.

  The Python tutorial covers this subject in
  [Virtual Environments and Packages](https://docs.python.org/3/tutorial/venv.html).
  The library reference explains
  [how virtual environments work](https://docs.python.org/3/library/venv.html#how-venvs-work).
  Both are written for people who already program, so do not worry if
  some of it is difficult to read now.
