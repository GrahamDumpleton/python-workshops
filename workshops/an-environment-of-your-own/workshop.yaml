name: an-environment-of-your-own
title: An environment of your own
version: 0.1.0
description: Learn how to give one project a Python environment of its own. You make a virtual environment, look at what is inside it, see what activating it changes in the terminal, install one package into it, run its Python without activating it, and then delete the environment and make it again.
