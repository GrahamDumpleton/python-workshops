apiVersion: jupyterlab-workshop/v1alpha1
name: a-proper-project
title: A proper project
version: 0.1.0
description: Learn how Python programmers organise a project. You describe the spending tracker in the file `pyproject.toml`, move its code into a directory `src`, and install the project into its own environment, so that the tests run against the installed code. You give the program a command of its own. Then you watch three tools at work on your code, a linter, a formatter and a type checker.
authors: [Graham Dumpleton]
homepage: https://github.com/GrahamDumpleton/python-workshops/tree/main/workshops/a-proper-project
issues: https://github.com/GrahamDumpleton/python-workshops/issues
tags: [python, beginners, pyproject, tools]
duration: 25m
platforms: [linux, macos]
capabilities:
  - terminal
  - write-files
  - kernel-exec
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_REQUIRE_VIRTUALENV: '1'
  PYTEST_ADDOPTS: '-p no:cacheprovider'
sidebar: filebrowser
layout: code
layouts:
