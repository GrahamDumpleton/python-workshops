        - { name: terminal, size: 0.4, tabs: ['terminal:workshop'] }
instructions: { side: right, width: 0.35 }
gating: soft
finish: |
  The spending tracker is now a proper project. You know that the
  file `pyproject.toml` describes a project: its name, its version,
  the packages that it needs, and the build system that installs it.
  You know why the code goes into a directory `src`: then nothing can
  import it by accident from the directory that the terminal is in,
  so the tests run against the installed code. You can install a
  project into its environment with `python -m pip install -e .`,
  and you know that "editable" means that a change to the code needs
  no new install. You gave the program a command of its own,
  `spending`, with the table `[project.scripts]`. You saw a linter
  (`python -m ruff check`) find a problem, a formatter
  (`python -m ruff format`) change the layout of long lines, and a
  type checker (`python -m mypy`) compare the type hints with the
  code.

  The next workshop is **Your own project**, the last workshop of
  the course. You choose one of four small programs, and you build it
  yourself, from a short description.

  The Python Packaging User Guide explains every part of the file in
  [Writing your pyproject.toml](https://packaging.python.org/en/latest/guides/writing-pyproject-toml/),
  and the reasons for the directory `src` in
  [src layout vs flat layout](https://packaging.python.org/en/latest/discussions/src-layout-vs-flat-layout/).
  The documentation of the tools is at
  [docs.astral.sh/ruff](https://docs.astral.sh/ruff/) and
  [mypy.readthedocs.io](https://mypy.readthedocs.io/). These pages
  are written for people who already program, so do not worry if
  some of the text is difficult to read now.
