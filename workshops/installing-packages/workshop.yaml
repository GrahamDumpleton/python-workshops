finish: |
  You can now use code that other people have published. You know
  that the word "package" also means code that someone has published
  for others to install, and that PyPI is the website that packages
  are installed from. You can install a package into an environment
  with `python -m pip install`, and you know that the package goes
  into the directory `site-packages` of that environment. You can
  show what an environment holds with `python -m pip list` and
  `python -m pip freeze`. You wrote a requirements file, deleted the
  environment, and got it back with
  `python -m pip install -r requirements.txt`. Then you used the
  package `rich` to show the spending as a table.

  The next workshop is **The same with uv**. The tool `uv` does the
  work of `python -m venv` and of pip, and it is much faster. In the
  next workshop you do each step of this workshop again with `uv`, so
  that you see which step of pip each command of `uv` stands for.

  The Python tutorial covers this topic in
  [Managing Packages with pip](https://docs.python.org/3/tutorial/venv.html#managing-packages-with-pip),
  and the documentation of pip describes
  [requirements files](https://pip.pypa.io/en/stable/user_guide/#requirements-files).
  The documentation of `rich` describes
  [tables](https://rich.readthedocs.io/en/stable/tables.html). All
  three are written for people who already program, so do not worry
  if some of the text is difficult to read now.
