name: installing-packages
title: Installing packages
version: 0.1.0
description: Learn how to use code that other people have published. You make an environment for the spending tracker, install the package `rich` into it with pip, and see where the package went. You write a requirements file that records what the project needs, delete the environment, and get it back from that file. Then you use `rich` to show the spending as a table.
