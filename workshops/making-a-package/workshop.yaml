name: making-a-package
title: Making a package
version: 0.1.0
description: Learn how to keep the modules of one program together in a package. You make a directory for the spending tracker, move its four modules into it, change their imports so that each module finds the others, and run the whole package by its name with one command.
authors: [Graham Dumpleton]
