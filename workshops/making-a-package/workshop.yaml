gating: soft
finish: |
  You can now make a package. You know that a package is a directory
  that holds modules, and that the file `__init__.py` marks the
  directory as a package. You can make a directory with `mkdir` and
  move a file with `mv`. You know that a module inside a package
  imports the other modules of the package with a dot before the name,
  such as `from .models import Ledger`, and that this is a relative
  import. You know why a file that has relative imports cannot be run
  by its path, and you can run a package by its name with
  `python -m spending`, which runs the file `__main__.py`. You can use
  the package in another program with
  `from spending.storage import read_ledger`.

  The next workshop is **Finding the bug**. A program in several files
  can go wrong in several files. The next workshop shows how to read
  an error message that names more than one file, and how to look
  inside a program while it runs.

  The Python tutorial covers packages in
  [Packages](https://docs.python.org/3/tutorial/modules.html#packages).
  It is written for people who already program, so do not worry if
  some of it is difficult to read now.
